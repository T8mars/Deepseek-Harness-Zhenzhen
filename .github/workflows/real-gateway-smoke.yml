name: Controlled real gateway smoke
run-name: Flash observation · ${{ (github.event_name == 'workflow_dispatch' && inputs.canary_tag) || (github.event_name == 'schedule' && vars.REAL_GATEWAY_SMOKE_CANARY) || 'main' }}
on:
  workflow_dispatch:
    inputs:
      confirm_paid_check:
        description: 'Send one fixed Flash request, max 512 output tokens; may incur gateway charges'
        required: true
        type: boolean
        default: false
      canary_tag:
        description: 'Optional fixed published canary tag; blank checks main without promotion evidence'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '43 2 * * *'
permissions:
  contents: read
concurrency:
  group: real-gateway-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.repository == 'T8mars/Deepseek-Harness-Zhenzhen' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_paid_check) || (github.event_name == 'schedule' && vars.REAL_GATEWAY_SMOKE_ENABLED == 'true'))
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      DSH_SMOKE_CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary_tag) || (github.event_name == 'schedule' && vars.REAL_GATEWAY_SMOKE_CANARY) || '' }}
      DSH_SMOKE_CONFIRM: ${{ inputs.confirm_paid_check }}
      DSH_SMOKE_SCHEDULE_ENABLED: ${{ vars.REAL_GATEWAY_SMOKE_ENABLED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: node scripts/check-private.mjs
      - name: Require exact main commit contracts
        run: node scripts/check-smoke-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - if: env.DSH_SMOKE_CANARY != ''
        run: npm run pack:bundle
      - name: Bind fixed published canary
        if: env.DSH_SMOKE_CANARY != ''
        run: node scripts/prepare-candidate-smoke.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: One fixed real Flash request
        run: node scripts/real-gateway-smoke.mjs --ci
        env:
          SEEDANCE_API_KEY: ${{ secrets.SEEDANCE_API_KEY }}
      - name: Export candidate observation
        if: always() && env.DSH_SMOKE_CANARY != ''
        run: node scripts/export-candidate-observation.mjs
      - if: always() && env.DSH_SMOKE_CANARY != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/candidate-observation/*
          if-no-files-found: ignore
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gateway-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/evidence/real-gateway-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 14
  notify:
    needs: smoke
    if: always() && needs.smoke.result == 'failure' && github.repository == 'T8mars/Deepseek-Harness-Zhenzhen' && github.ref == 'refs/heads/main' && vars.REAL_GATEWAY_SMOKE_REPORT_FAILURE == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: gateway-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/ci-gateway-report
      - run: node scripts/report-gateway-smoke.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_SMOKE_REPORT_FAILURE: ${{ vars.REAL_GATEWAY_SMOKE_REPORT_FAILURE }}
