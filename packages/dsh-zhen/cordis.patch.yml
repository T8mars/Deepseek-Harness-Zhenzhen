# Source: deepseek-ai/deepseek-harness dsh-v0.2.1-rc.2,
# packages/bundle/base/cordis.patch.yml and packages/bundle/web-app/cordis.patch.yml.
# Each config below is a COMPLETE replacement of that row's config.
- id: agent-default-model
  config:
    provider: seedance
    model: deepseek/deepseek-v4.1-flash

# Upstream llm-pi-ai row has no config. This is the entire provider declaration.
# Image inputs follow the reviewed explicit docs declarations; C37 verifies the public attachment wire.
# Reasoning/stream-usage switches and live image quality remain separately unverified.
- id: llm-pi-ai
  config:
    providers:
      seedance:
        displayName: Seedance
        api: openai-completions
        baseURL: https://api.seedance.nz/v1
        apiKeyEnv: SEEDANCE_API_KEY
        # Seedance llms.txt chat contract uses max_tokens; generic pi-ai detection
        # otherwise chooses max_completion_tokens for this custom provider route.
        compat:
          maxTokensField: max_tokens
        # Source: Seedance llms.txt SHA256 cd7d81ab06320a5d653a64e7413ca3834523fc7881b7b2bbf5077d2d878245e5.
        # C37: 15 explicitly documented image routes; other routes retain text-only declarations.
        # Unknown capacities use a 262144 request budget.
        # maxTokens 4096 is the default response budget, not a verified gateway maximum.
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 262144
            maxTokens: 4096
            input:
              - text
              - image
          - id: deepseek/deepseek-v4-flash-vision-exp
            name: DeepSeek Vision Exp
            contextWindow: 1048576
            maxTokens: 4096
            input:
              - text
              - image
          - id: glm/glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 262144
            maxTokens: 4096
            input:
              - text
              - image
          - id: glm-5.3
