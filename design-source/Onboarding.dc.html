<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首次引导</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="--bg:{{c.bg}};--l1:{{c.l1}};--l2:{{c.l2}};--ov:{{c.ov}};--sb:{{c.sb}};--sba:{{c.sba}};--bub:{{c.bub}};--t1:{{c.t1}};--t2:{{c.t2}};--t3:{{c.t3}};--t4:{{c.t4}};--lk:{{c.lk}};--pri:{{c.pri}};--onpri:{{c.onpri}};--acc:{{c.acc}};--send:{{c.send}};--ok:{{c.ok}};--warn:{{c.warn}};--warnt:{{c.warnt}};--err:{{c.err}};--idle:{{c.idle}};--bd:{{c.bd}};--vio:{{c.vio}};--tf:{{c.tf}};--tt:{{c.tt}};--glow:{{c.glow}};--sh1:{{c.sh1}};--sh3:{{c.sh3}}; position: relative; display: flex; align-items: center; justify-content: center; gap: 56px; flex-wrap: wrap; min-height: 880px; box-sizing: border-box; padding: 48px 40px; background: var(--bg); color: var(--t1); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 22px; overflow: hidden">

  <!-- 背景潮汐 -->
  <svg style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 260px" viewBox="0 0 1360 260" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 150 C 220 90 420 210 680 140 S 1120 80 1360 150 V260 H0Z" fill="{{c.wave1}}"></path>
    <path d="M0 190 C 260 140 460 240 720 180 S 1140 130 1360 190 V260 H0Z" fill="{{c.wave2}}"></path>
  </svg>

  <!-- 引导对话框 -->
  <div style="position: relative; width: 520px; max-width: 100%; background: var(--l2); border-radius: 28px; box-shadow: var(--sh3); overflow: hidden">
    <div style="padding: 28px 32px 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: flex-start; gap: 16px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 8px" role="img" aria-label="第 2 步，共 5 步">
            <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="height: 6px; width: {{d.w}}; border-radius: 3px; background: {{d.bg}}"></span></sc-for>
            <span style="font-size: 12px; line-height: 18px; color: var(--t3); margin-left: 4px">第 2 步 / 共 5 步</span>
          </div>
          <div style="font-size: 22px; line-height: 30px; font-weight: 600">填入你的 Seedance 密钥</div>
          <div style="font-size: 13px; line-height: 21px; color: var(--t2)">密钥以 <span style="font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--bub)">sk-</span> 开头，只保存在本机的凭据文件中，不会写进配置，也不会再次显示。</div>
        </div>
        <!-- A01 缩略位 -->
        <div style="flex: 0 0 96px; height: 120px; border-radius: 18px; border: 1.5px dashed var(--acc); background: var(--glow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; box-sizing: border-box" role="img" aria-label="角色立绘缩略位（用户美术）">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.4" opacity="0.85" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="var(--acc)"></circle><circle cx="12" cy="12" r="7.2" opacity="0.65"></circle><circle cx="12" cy="12" r="11" opacity="0.32"></circle></svg>
          <span style="font-size: 11px; line-height: 14px; color: var(--t3)">A01 缩略<br>用户美术</span>
        </div>
      </div>

      <!-- 输入 -->
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px 0 16px; border-radius: 23px; background: var(--bg); box-shadow: 0 0 0 1.5px var(--ok)">
          <span style="flex: 1; font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 13px; letter-spacing: 1px">sk-••••••••••••••••a3f2</span>
          <button type="button" aria-label="显示或隐藏" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: var(--t3); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M1.8 8S4 3.8 8 3.8 14.2 8 14.2 8 12 12.2 8 12.2 1.8 8 1.8 8Z"></path><circle cx="8" cy="8" r="1.8"></circle></svg></button>
          <button type="button" style="height: 34px; padding: 0 16px; border: 0; border-radius: 17px; background: var(--bub); color: var(--pri); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">已校验</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; color: var(--ok)"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ok)"></span>校验通过，当前余额 <b style="font-variant-numeric: tabular-nums">¥ 128.40</b></div>
        <a style="font-size: 12px; line-height: 18px; color: var(--lk); text-decoration: underline">没有密钥？前往 api.seedance.nz 获取</a>
      </div>

      <!-- 默认设置摘要 -->
      <div style="border-radius: 16px; background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
        <div style="display: flex; justify-content: space-between"><span style="color: var(--t3)">默认网关</span><span style="font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 12px">api.seedance.nz/v1</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: var(--t3)">默认模型</span><span style="font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 12px">deepseek/deepseek-v4.1-flash</span></div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 22px">
        <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: transparent; color: var(--t2); font: inherit; cursor: pointer">上一步</button>
        <span style="flex: 1"></span>
        <button type="button" style="height: 40px; padding: 0 20px; border: 0; border-radius: 20px; background: transparent; color: var(--t2); font: inherit; cursor: pointer">稍后设置</button>
        <button type="button" style="height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: var(--send); color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer">下一步</button>
      </div>
    </div>
    <svg style="display: block; width: 100%; height: 36px" viewBox="0 0 520 36" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 18 C 80 4 150 30 260 16 S 440 6 520 18 V36 H0Z" fill="{{c.wave1}}"></path>
      <path d="M0 26 C 90 14 170 36 280 24 S 440 16 520 26 V36 H0Z" fill="{{c.wave2}}"></path>
    </svg>
  </div>

  <!-- 状态示意列 -->
  <div style="position: relative; width: 380px; max-width: 100%; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; line-height: 18px; color: var(--t3); padding: 0 4px">校验失败时的提示（用人话，不贴原始报错）</div>
    <sc-for list="{{states}}" as="s" hint-placeholder-count="5">
      <div style="border-radius: 16px; background: var(--l1); box-shadow: var(--sh1); padding: 12px 14px; display: flex; gap: 12px">
        <span style="flex: 0 0 8px; height: 8px; margin-top: 7px; border-radius: 50%; box-sizing: border-box; background: {{s.dot}}; border: {{s.ring}}"></span>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600; font-size: 13px">{{s.t}}</span><span style="font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 11px; color: var(--t4)">{{s.code}}</span></div>
          <div style="font-size: 12px; line-height: 19px; color: var(--t2)">{{s.d}}</div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; line-height: 14px; color: var(--t3)">界面示意稿 · 密钥为遮罩示意，余额为示例</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":1360,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const L = {bg:'#F4F9FA',l1:'#FFFFFF',l2:'#FFFFFF',ov:'#E1ECEF',sb:'#EAF3F5',sba:'#D6E8EC',bub:'#E1F2F4',t1:'#0B1F26',t2:'#34494F',t3:'#435C65',t4:'#566F78',lk:'#0A6AA1',pri:'#0F5B6B',onpri:'#FFFFFF',acc:'#0B7A8C',send:'#0B7285',ok:'#0F7D4D',warn:'#B87100',warnt:'#8A5300',err:'#C62D3A',idle:'#6E8790',bd:'rgba(8,70,88,0.14)',vio:'#5B4BC2',tf:'#BFEFF3',tt:'#DCEBFF',glow:'rgba(79,209,220,0.14)',sh1:'0 0 0 0.5px rgba(8,70,88,0.14), 0 6px 20px rgba(8,70,88,0.05)',sh3:'0 0 0 0.5px rgba(8,70,88,0.14), 0 24px 64px rgba(8,70,88,0.16)',wave1:'rgba(79,209,220,0.22)',wave2:'rgba(121,168,255,0.20)'};
    const D = {bg:'#0A1418',l1:'#0F1C21',l2:'#14242A',ov:'#2D434B',sb:'#0C171B',sba:'#1F3A43',bub:'#17323A',t1:'#E8F4F6',t2:'#B7CCD2',t3:'#93AEB6',t4:'#869FA6',lk:'#6CC6F2',pri:'#8FE3EA',onpri:'#04222A',acc:'#4FD1DC',send:'#0C7A8A',ok:'#3DD68C',warn:'#F5B84A',warnt:'#F5B84A',err:'#FF7A85',idle:'#4D6770',bd:'rgba(214,240,245,0.14)',vio:'#B7ACFF',tf:'#0F4F5C',tt:'#14304F',glow:'rgba(79,209,220,0.10)',sh1:'0 0 0 0.5px rgba(214,240,245,0.16), 0 6px 20px rgba(0,0,0,0.26)',sh3:'0 0 0 0.5px rgba(214,240,245,0.16), 0 24px 64px rgba(0,0,0,0.6)',wave1:'rgba(79,209,220,0.16)',wave2:'rgba(121,168,255,0.14)'};
    const c = dark ? D : L;
    const dots = [0, 1, 2, 3, 4].map(i => ({ w: i === 1 ? '28px' : '14px', bg: i < 1 ? c.acc : (i === 1 ? c.acc : c.sba) }));
    const states = [
      { t: '校验中', code: '', d: '正在向网关确认密钥并读取余额，通常不到几秒。', dot: 'transparent', ring: '1.5px solid ' + c.acc },
      { t: '密钥无效', code: '401', d: '网关不认这个密钥。请检查是否复制完整，开头应为 sk-，且没有多余空格。', dot: c.err, ring: '0 none' },
      { t: '请求太频繁', code: '429', d: '网关暂时限流，稍等几秒再点校验即可，密钥本身没有问题。', dot: c.warn, ring: '0 none' },
      { t: '网络不通', code: '', d: '连不上 api.seedance.nz。请检查网络或代理设置后重试。', dot: c.err, ring: '0 none' },
      { t: '余额为 0', code: '', d: '密钥有效。可以先体验对话，需要生成图片或视频时再充值。', dot: c.warn, ring: '0 none' }
    ];
    return { c, dots, states };
  }
}
</script>
</body>
</html>
